name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: https://nfwbpyxmbjagzgsullyn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MVuXiDRRRYllhRe-YuS-7g_Ar-TSbWr
        run: npm run build

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Supabase login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy Supabase Edge Function
        run: supabase functions deploy notify-project-change --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Set Supabase function secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROJECT_NOTIFICATION_TO: ${{ secrets.PROJECT_NOTIFICATION_TO }}
          PROJECT_NOTIFICATION_FROM: ${{ secrets.PROJECT_NOTIFICATION_FROM }}
        run: |
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" PROJECT_NOTIFICATION_TO="$PROJECT_NOTIFICATION_TO" PROJECT_NOTIFICATION_FROM="$PROJECT_NOTIFICATION_FROM" --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4